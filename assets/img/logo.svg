<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 100" role="img" aria-label="Casa Shine">
  <!-- crown -->
  <g fill="#FFD60A">
    <path d="M22 88 L12 30 Q27 44 40 52 L42 18 Q53 36 58 46 L70 9 L82 46 Q87 36 98 18 L100 52 Q113 44 128 30 L118 88 Z"/>
    <circle cx="11" cy="25.5" r="6"/>
    <circle cx="42" cy="13" r="6"/>
    <circle cx="70" cy="6" r="6"/>
    <circle cx="98" cy="13" r="6"/>
    <circle cx="129" cy="25.5" r="6"/>
  </g>
  <!-- car, front view -->
  <g fill="#0A0A0A">
    <!-- cabin -->
    <path d="M38 62 L45 49 Q47.5 45 53 45 H87 Q92.5 45 95 49 L102 62 Z"/>
    <!-- body -->
    <path d="M27 69 Q27 62 34 61 H106 Q113 62 113 69 V86 Q113 89 110 89 H30 Q27 89 27 86 Z"/>
    <!-- mirrors -->
    <path d="M30 58 Q30 55 33 55 H39 L37.5 60 H32 Q30 60 30 58 Z"/>
    <path d="M110 58 Q110 55 107 55 H101 L102.5 60 H108 Q110 60 110 58 Z"/>
    <!-- wheels -->
    <rect x="31" y="86" width="15" height="9" rx="2.5"/>
    <rect x="94" y="86" width="15" height="9" rx="2.5"/>
  </g>
  <g fill="#FFD60A">
    <!-- windscreen -->
    <path d="M44 60 L49 50.5 Q50.5 48.5 54 48.5 H86 Q89.5 48.5 91 50.5 L96 60 Z"/>
    <!-- headlights -->
    <path d="M32 67 Q32 65 34.5 65 H50 L47 72 H35 Q32 72 32 70 Z"/>
    <path d="M108 67 Q108 65 105.5 65 H90 L93 72 H105 Q108 72 108 70 Z"/>
    <!-- grille -->
    <rect x="55" y="66" width="30" height="2.4" rx="1.2"/>
    <rect x="55" y="70.4" width="30" height="2.4" rx="1.2"/>
    <rect x="55" y="74.8" width="30" height="2.4" rx="1.2"/>
    <!-- bumper + fog lights -->
    <rect x="34" y="81" width="72" height="2.6" rx="1.3"/>
    <circle cx="38" cy="76.5" r="2"/>
    <circle cx="102" cy="76.5" r="2"/>
  </g>
  <!-- shine on the windscreen -->
  <g fill="#0A0A0A">
    <path d="M58 50.5 l1.3 3.4 3.4 1.3 -3.4 1.3 -1.3 3.4 -1.3 -3.4 -3.4 -1.3 3.4 -1.3z"/>
    <path d="M67 50 l.8 2 2 .8 -2 .8 -.8 2 -.8 -2 -2 -.8 2 -.8z"/>
    <path d="M78 55 L84 49.5 H87.5 L80 56.5 Z" opacity=".55"/>
    <path d="M83 57.5 L90 51 H91.5 L84.5 57.5 Z" opacity=".55"/>
  </g>
  <!-- wash bubbles -->
  <g fill="none" stroke="#FFD60A" stroke-width="2">
    <circle cx="8" cy="76" r="5"/>
    <circle cx="13" cy="90" r="3"/>
    <circle cx="132" cy="72" r="4"/>
    <circle cx="127" cy="88" r="5.5"/>
  </g>
  <g fill="#FFD60A">
    <circle cx="3" cy="62" r="1.8"/>
    <circle cx="137" cy="58" r="1.6"/>
  </g>
