<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Car wash website — social posts</title>
<!-- 6 sales posts in French and Arabic, 1080x1350 (4:5 feed format).
     Open posts.html#p=1&l=fr … #p=6&l=ar  ·  export all: bash tools/export-posts.sh -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@500;600;700&family=Cairo:wght@600;700;800;900&display=block" rel="stylesheet">
<style>
  :root{--ink:#0A0A0A;--y:#FFD60A;--g:#25D366;--mut:rgba(255,255,255,.68)}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;overflow:hidden;background:var(--ink)}
  body{font-family:Inter,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
  [dir=rtl] body{font-family:Cairo,sans-serif}
  .s{position:relative;width:1080px;height:1350px;padding:64px 70px 60px;display:flex;flex-direction:column;overflow:hidden}
  .s::before{content:"";position:absolute;inset:0;background:
    radial-gradient(760px 600px at 75% 62%,rgba(255,214,10,.2),transparent 70%),
    radial-gradient(600px 420px at 8% 100%,rgba(255,214,10,.08),transparent 70%),
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/54px 54px,
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/54px 54px}
  .s>*{position:relative}
  [dir=rtl] .s::before{transform:scaleX(-1)}
  .top{display:flex;justify-content:space-between;align-items:center}
  .kick{display:flex;align-items:center;gap:12px;font-weight:700;font-size:21px;letter-spacing:.16em;color:var(--y)}
  [dir=rtl] .kick{letter-spacing:0;font-size:26px}
  .kick i{width:12px;height:12px;border-radius:50%;background:var(--y);box-shadow:0 0 0 6px rgba(255,214,10,.18)}
  .num{font-family:"Bricolage Grotesque";font-weight:800;font-size:24px;color:var(--mut);border:1.5px solid rgba(255,255,255,.2);border-radius:999px;padding:8px 18px}
  h1{font-family:"Bricolage Grotesque";font-weight:800;font-size:100px;line-height:.92;letter-spacing:-.05em;margin-top:40px}
  [dir=rtl] h1{font-family:Cairo;font-weight:900;letter-spacing:0;line-height:1.15;font-size:84px}
  h1 em{font-style:normal;color:var(--y)}
  .sub{font-size:29px;line-height:1.4;color:var(--mut);margin-top:24px;max-width:900px}
  [dir=rtl] .sub{font-size:32px;line-height:1.6}
  .vis{position:relative;flex:1;margin-top:36px;overflow-x:visible;overflow-y:clip;overflow-clip-margin:40px}
  .phone.full{top:0!important;bottom:4px;width:auto!important;display:flex}
  .phone.full .in{height:100%;width:auto}
  .vis>*{z-index:1}
  /* devices */
  .laptop{position:absolute;width:820px;top:30px;left:-10px}
  .laptop .scr{background:#1b1b1b;border-radius:22px 22px 0 0;padding:14px 14px 0;box-shadow:0 40px 80px -20px rgba(0,0,0,.8),inset 0 0 0 1.5px #333}
  .laptop .scr img{display:block;width:100%;border-radius:8px 8px 0 0}
  .laptop .base{height:22px;margin:0 -50px;background:linear-gradient(#d0d0d0,#8a8a8a);border-radius:0 0 22px 22px;position:relative}
  .laptop .base::before{content:"";position:absolute;left:50%;top:0;width:140px;height:9px;transform:translateX(-50%);background:#777;border-radius:0 0 10px 10px}
  .phone{position:absolute;width:300px;background:#111;border-radius:48px;padding:12px;box-shadow:0 40px 90px -10px rgba(0,0,0,.85),inset 0 0 0 2px #3a3a3a}
  .phone .in{border-radius:37px;overflow:hidden;aspect-ratio:390/844;position:relative;background:#E9E9E6}
  .phone .in img{position:absolute;left:0;width:100%;top:var(--crop,0)}
  .phone::after{content:"";position:absolute;left:50%;top:24px;width:86px;height:24px;transform:translateX(-50%);background:#000;border-radius:20px;z-index:2}
  .tagline{position:absolute;background:var(--y);color:var(--ink);border-radius:20px;padding:16px 22px;font-weight:800;font-size:25px;box-shadow:0 16px 36px rgba(0,0,0,.45);display:flex;align-items:center;gap:12px;white-space:nowrap}
  [dir=rtl] .tagline{font-size:28px}
  .tagline svg{width:30px;height:30px;color:var(--g);flex:none}
  .ticks{list-style:none;display:grid;gap:18px}
  .ticks li{display:flex;align-items:center;gap:16px;font-size:29px;font-weight:600}
  [dir=rtl] .ticks li{font-size:32px}
  .ticks b{width:42px;height:42px;border-radius:50%;background:var(--y);color:var(--ink);display:grid;place-items:center;font-size:22px;flex:none}
  /* comparison */
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:22px;height:100%}
  .col{border-radius:32px;padding:44px 34px;display:flex;flex-direction:column;gap:34px}
  .col h3{font-family:"Bricolage Grotesque";font-size:56px;letter-spacing:-.03em;margin-bottom:4px}
  [dir=rtl] .col h3{font-family:Cairo;font-weight:900;letter-spacing:0}
  .col p{display:flex;gap:16px;font-size:32px;line-height:1.25;font-weight:700;align-items:flex-start}
  [dir=rtl] .col p{font-size:34px;line-height:1.45}
  .col p b{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:23px;flex:none;margin-top:2px}
  .bad{background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.12);color:rgba(255,255,255,.75)}
  .bad b{background:#3a1d1d;color:#ff6b6b}
  .good{background:var(--y);color:var(--ink)}
  .good b{background:var(--ink);color:var(--y)}
  /* footer */
  .foot{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:34px;padding-top:28px;border-top:1.5px solid rgba(255,255,255,.14)}
  .cta{display:flex;align-items:center;gap:14px;background:var(--y);color:var(--ink);border-radius:999px;padding:20px 32px;font-weight:800;font-size:27px}
  [dir=rtl] .cta{font-size:30px}
  .cta svg{width:32px;height:32px}
  .swipe{font-weight:700;font-size:24px;color:var(--mut);display:flex;align-items:center;gap:10px}
  [dir=rtl] .swipe{font-size:27px}
  .swipe span{font-size:34px;color:var(--y)}
</style>
</head>
<body>
<div class="s" id="s"></div>
<script>
const W = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12c0 2.1.6 4.2 1.6 6L0 24l6.2-1.6c1.8 1 3.8 1.5 5.8 1.5 6.6 0 12-5.4 12-12S18.6 0 12 0z"/></svg>`;
const DM = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-5.1A8 8 0 1 1 21 12z"/></svg>`;
const laptop = (src, style = "") => `<div class="laptop" style="${style}"><div class="scr"><img src="shots/${src}"></div><div class="base"></div></div>`;
const phone = (src, style, crop = "0px") => `<div class="phone${/top:0;/.test(style) ? " full" : ""}" style="${style}"><div class="in"><img src="shots/${src}" style="--crop:${crop}"></div></div>`;
const tag = (txt, style) => `<div class="tagline" style="${style}">${W}${txt}</div>`;
const ticks = (list, style = "") => `<ul class="ticks" style="${style}">${list.map(t => `<li><b>✓</b>${t}</li>`).join("")}</ul>`;

const T = {
  fr: {
    kick: "SITE WEB · LAVAGE AUTO", cta: "Écrivez-moi en DM", swipe: "Glissez",
    s: [
      { h: "Votre car wash<br>mérite un <em>site pro.</em>", p: "Pensé pour les lavages auto à Casablanca. Beau sur ordinateur, parfait sur téléphone.",
        v: () => laptop("desk-home.png", "top:10px") + phone("phone-home.jpg", "width:250px;right:0;top:150px;transform:rotate(4deg)") },
      { h: "Vos clients réservent<br>sur <em>WhatsApp.</em>", p: "Ils choisissent le service, la voiture et le quartier, et la demande arrive directement sur votre WhatsApp.",
        v: () => phone("phone-book.jpg", "width:330px;inset-inline-start:30px;top:0;transform:rotate(-3deg)", "-28px") + tag("Réservation en 30 s", "inset-inline-end:40px;top:120px;transform:rotate(3deg)") + ticks(["Sans appel", "Sans attente", "Jour et nuit"], "position:absolute;inset-inline-end:30px;top:290px") },
      { h: "Vos prix clairs,<br><em>sans surprise.</em>", p: "Citadine, berline, SUV ou luxe : le client voit son prix tout de suite. Moins de questions, plus de réservations.",
        v: () => phone("phone-pricing.jpg", "width:330px;inset-inline-end:40px;top:0;transform:rotate(3deg)", "-120px") + ticks(["Prix par véhicule", "Formules & options", "Facile à modifier"], "position:absolute;inset-inline-start:0;top:110px") },
      { h: "Montrez vos plus<br>beaux <em>résultats.</em>", p: "Galerie de vos réalisations, avant / après interactif et avis de vos clients : la confiance avant même le premier lavage.",
        v: () => phone("phone-works.jpg", "width:320px;inset-inline-start:40px;top:0;transform:rotate(-3deg)", "-60px") + ticks(["Galerie photos", "Avant / après", "Avis clients"], "position:absolute;inset-inline-end:20px;top:120px") },
      { h: "Sans site <em>vs</em><br>avec site.", p: "",
        v: () => `<div class="cmp">
          <div class="col bad"><h3>Sans site</h3><p><b>✕</b>Invisible sur Google</p><p><b>✕</b>Les clients appellent pour les prix</p><p><b>✕</b>Pas de photos de vos résultats</p><p><b>✕</b>Image peu professionnelle</p></div>
          <div class="col good"><h3>Avec site</h3><p><b>✓</b>Vos services visibles 24h/24</p><p><b>✓</b>Réservations sur WhatsApp</p><p><b>✓</b>Vos photos et avis clients</p><p><b>✓</b>Une image premium</p></div></div>` },
      { h: "Votre site,<br>à <em>votre image.</em>", p: "Votre logo, vos couleurs, vos prix et votre numéro WhatsApp. Une vraie vitrine pour votre lavage auto.",
        v: () => laptop("desk-pricing.png", "top:20px;width:760px;left:170px;opacity:.95") + ticks(["Votre logo & couleurs", "Vos services & prix", "Votre WhatsApp", "Ordinateur + mobile"], "position:absolute;inset-inline-start:0;bottom:20px;background:rgba(10,10,10,.82);padding:30px 34px;border-radius:30px;border:1.5px solid rgba(255,255,255,.14)") }
    ]
  },
  ar: {
    kick: "موقع إلكتروني · غسيل السيارات", cta: "راسلني في الخاص", swipe: "اسحب",
    s: [
      { h: "مغسلة سيارتك تستحق<br><em>موقعًا احترافيًا.</em>", p: "مصمم خصيصًا لمغاسل السيارات في الدار البيضاء. جميل على الحاسوب، ومثالي على الهاتف.",
        v: () => laptop("desk-home.png", "top:10px") + phone("phone-home.jpg", "width:250px;right:0;top:150px;transform:rotate(-4deg)") },
      { h: "زبناؤك يحجزون<br>عبر <em>واتساب.</em>", p: "يختار الزبون الخدمة ونوع السيارة والحي، ويصلك الطلب مباشرة على واتساب.",
        v: () => phone("phone-book.jpg", "width:330px;inset-inline-start:30px;top:0;transform:rotate(3deg)", "-28px") + tag("حجز في 30 ثانية", "inset-inline-end:40px;top:120px;transform:rotate(-3deg)") + ticks(["بدون مكالمات", "بدون انتظار", "ليلًا ونهارًا"], "position:absolute;inset-inline-end:40px;top:290px") },
      { h: "أسعار واضحة،<br><em>بدون مفاجآت.</em>", p: "سيارة صغيرة، سيدان، SUV أو فاخرة: الزبون يرى السعر فورًا. أسئلة أقل، وحجوزات أكثر.",
        v: () => phone("phone-pricing.jpg", "width:330px;inset-inline-end:40px;top:0;transform:rotate(-3deg)", "-120px") + ticks(["السعر حسب السيارة", "باقات وخدمات إضافية", "تعديل سهل"], "position:absolute;inset-inline-start:0;top:110px") },
      { h: "اعرض أجمل<br><em>أعمالك.</em>", p: "معرض لأعمالك، صور قبل / بعد، وآراء زبنائك: الثقة تبدأ قبل أول غسلة.",
        v: () => phone("phone-works.jpg", "width:320px;inset-inline-start:40px;top:0;transform:rotate(3deg)", "-60px") + ticks(["معرض الصور", "قبل / بعد", "آراء الزبناء"], "position:absolute;inset-inline-end:30px;top:120px") },
      { h: "بدون موقع <em>أو</em><br>مع موقع؟", p: "",
        v: () => `<div class="cmp">
          <div class="col bad"><h3>بدون موقع</h3><p><b>✕</b>غير موجود على Google</p><p><b>✕</b>الزبناء يتصلون لمعرفة الأسعار</p><p><b>✕</b>لا صور لأعمالك</p><p><b>✕</b>صورة غير احترافية</p></div>
          <div class="col good"><h3>مع موقع</h3><p><b>✓</b>خدماتك ظاهرة 24/24</p><p><b>✓</b>حجوزات عبر واتساب</p><p><b>✓</b>صورك وآراء زبنائك</p><p><b>✓</b>صورة راقية لمشروعك</p></div></div>` },
      { h: "موقعك<br>على <em>صورتك.</em>", p: "شعارك، ألوانك، أسعارك ورقم واتساب ديالك. واجهة حقيقية لمغسلة سيارتك.",
        v: () => laptop("desk-pricing.png", "top:20px;width:760px;left:170px;opacity:.95") + ticks(["شعارك وألوانك", "خدماتك وأسعارك", "رقم واتساب ديالك", "حاسوب + هاتف"], "position:absolute;inset-inline-start:0;bottom:20px;background:rgba(10,10,10,.82);padding:30px 34px;border-radius:30px;border:1.5px solid rgba(255,255,255,.14)") }
    ]
  }
};

const q = new URLSearchParams(location.hash.slice(1));
const n = Math.min(Math.max(+q.get("p") || 1, 1), 6), L = q.get("l") === "ar" ? "ar" : "fr", t = T[L], d = t.s[n - 1];
document.documentElement.lang = L; document.documentElement.dir = L === "ar" ? "rtl" : "ltr";
document.getElementById("s").innerHTML = `
  <div class="top"><span class="kick"><i></i>${t.kick}</span><span class="num" dir="ltr">0${n} / 06</span></div>
  <h1>${d.h}</h1>${d.p ? `<p class="sub">${d.p}</p>` : ""}
  <div class="vis">${d.v()}</div>
  <div class="foot"><span class="cta">${DM}${t.cta}</span>${n < 6 ? `<span class="swipe">${t.swipe} <span>${L === "ar" ? "←" : "→"}</span></span>` : ""}</div>`;
</script>
</body>
</html>
